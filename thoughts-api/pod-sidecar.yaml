apiVersion: v1
kind: Pod
metadata:
  name: thoughts-con-sidecar
  namespace: example
spec:
  containers:
  - name: api
    image: miusuario/thoughts-api:v1
    imagePullPolicy: Never
    ports:
    - containerPort: 8000
    command: ["sh", "-c"]
    args: ["python app.py 2>&1 | tee /var/log/app/app.log"]
    volumeMounts:
    - name: logs
      mountPath: /var/log/app
  - name: log-shipper
    image: busybox:1.36
    command: ["sh", "-c", "tail -F /var/log/app/app.log"]
    volumeMounts:
    - name: logs
      mountPath: /var/log/app
      readOnly: true
  volumes:
  - name: logs
    emptyDir: {}
