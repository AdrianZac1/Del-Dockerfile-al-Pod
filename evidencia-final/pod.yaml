
apiVersion: v1
kind: Pod
metadata:
  name: miapp-avalos
  namespace: k8s-avalos
  labels:
    app: miapp
    version: avalos-1-0
spec:
  containers:
    - name: api
      image: miapp:avalos-1.0
      imagePullPolicy: Never
      ports:
        - name: http
          containerPort: 9090
          protocol: TCP
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "250m"
          memory: "128Mi"
      readinessProbe:
        httpGet:
          path: /healthz
          port: 9090
        initialDelaySeconds: 2
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
