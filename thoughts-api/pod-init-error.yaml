apiVersion: v1
kind: Pod
metadata:
  name: thoughts-init-error
  namespace: example
spec:
  initContainers:
  - name: preparar-config
    image: busybox:1.36
    command: ["sh", "-c", "echo 'Error intencional de configuracion'; exit 1"]
  containers:
  - name: api
    image: miusuario/thoughts-api:v1
    imagePullPolicy: Never
    ports:
    - containerPort: 8000
