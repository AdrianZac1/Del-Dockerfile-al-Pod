apiVersion: v1
kind: Pod
metadata:
  name: thoughts-api
  namespace: example
  labels:
    app: thoughts-api
spec:
  containers:
  - name: api
    image: miusuario/thoughts-api:v1
    imagePullPolicy: Never
    ports:
    - containerPort: 8000
    env:
    - name: APP_VERSION
      value: "v1-desde-yaml"
