
apiVersion: v1
kind: Pod
metadata:
  name: miapp-fallo
  namespace: k8s-avalos
  labels:
    app: miapp
    prueba: diagnostico
spec:
  containers:
    - name: api
      image: miapp:avalos-1.0
      imagePullPolicy: Never
      ports:
        - containerPort: 9090
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "250m"
          memory: "128Mi"
      readinessProbe:
        httpGet:
          path: /healthz
          port: 9090
        initialDelaySeconds: 2
        periodSeconds: 5
